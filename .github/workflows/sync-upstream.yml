name: Sync fork with upstream

on:
  schedule:
    - cron: "*/10 * * * *" # Daily at 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync 20.0 from upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh repo sync rachmayadi/odoo --source odoo/odoo --branch 20.0
